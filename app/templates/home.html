<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Portal — Login</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📅</text></svg>">
</head>
<body>

<!-- ── Top Bar ─────────────────────────────────────────────────── -->
<nav class="topbar">
  <div class="topbar-brand">
    <span class="logo-dot"></span>
    Attendance Portal
  </div>
  <div class="topbar-right">
    Employee Self-Service
  </div>
</nav>

<!-- ── Hero Section ────────────────────────────────────────────── -->
<main class="home-hero">
  <div class="home-card">

    <div class="home-card-header">
      <div class="home-logo-ring">
        <!-- Calendar icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 4h-1V2h-2v2H8V2H6v2H5C3.89 2 3 2.9 3 4v16a2 2 0 002 2h14a2 2 0 002-2V4a2 2 0 00-2-2zm0 18H5V9h14v13zM7 11h5v5H7z"/>
        </svg>
      </div>
      <h1>Employee Attendance</h1>
      <p>Verify your details to view your attendance dashboard</p>
    </div>

    <!-- Error alert -->
    {% if error %}
    <div class="alert alert-error" role="alert">
      ⚠ {{ error }}
    </div>
    {% endif %}

    <!-- Validation form -->
    <form method="POST" action="/" autocomplete="off">

      <div class="form-group">
        <label for="emp_code">Employee Code</label>
        <input
          type="text"
          id="emp_code"
          name="emp_code"
          class="form-control"
          placeholder="e.g. EMP001"
          value="{{ prev_emp_code or '' }}"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="emp_name">Full Name</label>
        <input
          type="text"
          id="emp_name"
          name="emp_name"
          class="form-control"
          placeholder="As per company records"
          value="{{ prev_emp_name or '' }}"
          required
        >
      </div>

      <div class="form-group">
        <label for="branch_id">Branch / Office</label>
        <select id="branch_id" name="branch_id" class="form-control" required>
          <option value="">— Select Branch —</option>
          {% for branch in branches %}
          <option
            value="{{ branch.id }}"
            {% if prev_branch_id and prev_branch_id == branch.id %}selected{% endif %}
          >
            {{ branch.branch_name }}{% if branch.branch_code %} ({{ branch.branch_code }}){% endif %}
          </option>
          {% endfor %}
        </select>
      </div>

      <button type="submit" class="btn-primary">
        View My Attendance →
      </button>

    </form>

  </div>
</main>

</body>
</html>
